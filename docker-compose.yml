services:
  # API service - FastAPI application
  api:
    image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim
    container_name: alejandria-api
    working_dir: /workspace
    volumes:
      - ./backend:/workspace
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgresql:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_GRPC_URL=http://qdrant:6334
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    command: ["uv", "run", "uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    networks:
      - alejandria-network

  # MCP server service
  mcp:
    image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim
    container_name: alejandria-mcp
    working_dir: /workspace
    volumes:
      - ./backend:/workspace
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgresql:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_GRPC_URL=http://qdrant:6334
      - MCP_API_KEY_REQUIRED=false
      - MCP_TRANSPORT=http
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    command: ["uv", "run", "python", "-m", "mcp_server.server"]
    ports:
      - "8001:8000"
    networks:
      - alejandria-network

  # Frontend service - React application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: alejandria-frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://api:8000/api/v1
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - alejandria-network
    profiles:
      - frontend  # Solo se inicia con --profile frontend

  # Dev environment - Python shell for development and testing
  dev:
    image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim
    container_name: alejandria-dev
    working_dir: /workspace
    volumes:
      - ./backend:/workspace
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgresql:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_GRPC_URL=http://qdrant:6334
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    command: ["tail", "-f", "/dev/null"]  # Keep container running for interactive use
    networks:
      - alejandria-network
    profiles:
      - dev  # Solo se inicia con --profile dev

  postgresql:
    image: postgres:18.3-bookworm
    container_name: alejandria-postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alejandria-network

  redis:
    image: redis:7.4.9-bookworm
    container_name: alejandria-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alejandria-network

  qdrant:
    image: qdrant/qdrant:v1.17.1
    container_name: alejandria-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    env_file:
      - .env
    environment:
      - QDRANT__LOG_LEVEL=${QDRANT_LOG_LEVEL}
    networks:
      - alejandria-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local

networks:
  alejandria-network:
    driver: bridge
